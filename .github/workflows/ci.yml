name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the Go version from go.mod
        id: go
        shell: bash
        run: |
          set -eu
          version="$(sed -n 's/^go \([0-9][0-9]*\.[0-9][0-9]*\).*$/\1/p' go.mod)"
          if [ -z "$version" ]; then
            echo "go.mod does not declare a Go version" >&2
            exit 1
          fi
          echo "minor=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.minor }}
          check-latest: true
          cache: true

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          verify: false

      - name: Test
        run: go test ./...

      - name: Live E2E test
        if: matrix.os == 'ubuntu-latest'
        run: go test -tags e2e ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the Go version from go.mod
        id: go
        shell: bash
        run: |
          set -eu
          version="$(sed -n 's/^go \([0-9][0-9]*\.[0-9][0-9]*\).*$/\1/p' go.mod)"
          if [ -z "$version" ]; then
            echo "go.mod does not declare a Go version" >&2
            exit 1
          fi
          echo "minor=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.minor }}
          check-latest: true
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
